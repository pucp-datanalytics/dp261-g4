name: Deploy MVP

on:
  push:
    branches:
      - feat/PB-review3

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: us-east-1

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build Docker image
        run: docker build -t dp261-g4 .

      - name: Tag Docker image
        run: |
          docker tag dp261-g4:latest 009030765814.dkr.ecr.us-east-1.amazonaws.com/dp261-g4:latest

      - name: Push Docker image
        run: |
          docker push 009030765814.dkr.ecr.us-east-1.amazonaws.com/dp261-g4:latest

      - name: Deploy on EC2
        uses: appleboy/ssh-action@v1.0.3
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
          AWS_REGION: us-east-1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: AWS_ACCESS_KEY_ID,AWS_SECRET_ACCESS_KEY,AWS_SESSION_TOKEN,AWS_REGION
          script: |
            aws ecr get-login-password --region us-east-1 | sudo docker login --username AWS --password-stdin 009030765814.dkr.ecr.us-east-1.amazonaws.com

            sudo docker pull 009030765814.dkr.ecr.us-east-1.amazonaws.com/dp261-g4:latest

            sudo docker stop dp261-g4 || true
            sudo docker rm dp261-g4 || true

            sudo docker run -d \
              --name dp261-g4 \
              -p 8080:8080 \
              009030765814.dkr.ecr.us-east-1.amazonaws.com/dp261-g4:latest

            sudo docker image prune -f